# Configuración para el servicio API en Railway.
# Root Directory: raíz del repo (para Prisma y workspaces).
#
# Pre-deploy: no-op (evita que @cleexs/web ejecute migraciones con DATABASE_URL local).
# Migraciones: en el start de la API vía `npm run deploy:api`.

[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = "/bin/true"
startCommand = "npm run deploy:api"
healthcheckPath = "/health"
healthcheckTimeout = 120
