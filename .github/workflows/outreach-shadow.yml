name: Outreach Shadow

on:
  schedule:
    # Diario 13:30 UTC (10:30 Argentina aprox). Envia REAL al competidor (mode=real).
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview candidates without sending emails'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      mode:
        description: 'Send mode (shadow = buzón interno, real = competidor)'
        required: true
        default: 'shadow'
        type: choice
        options:
          - 'shadow'
          - 'real'
      limit:
        description: 'Maximum contacts to process'
        required: true
        default: '10'

jobs:
  outreach-shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger outreach batch
        env:
          CRON_SECRET: ${{ secrets.CLEEXS_CRON_SECRET }}
          API_URL: https://cleexsapi-production.up.railway.app
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          MODE: ${{ github.event_name == 'schedule' && 'real' || inputs.mode }}
          LIMIT: ${{ github.event_name == 'schedule' && '10' || inputs.limit }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CLEEXS_CRON_SECRET GitHub secret"
            exit 1
          fi

          payload=$(jq -n \
            --argjson limit "$LIMIT" \
            --argjson dryRun "$DRY_RUN" \
            --arg mode "$MODE" \
            '{limit:$limit, dryRun:$dryRun, mode:$mode}')

          curl --fail-with-body -sS \
            -X POST "$API_URL/api/cron/outreach-shadow" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload"
