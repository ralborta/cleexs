name: Outreach Shadow

on:
  # Pausado 2026-09-03: solo onboarding paso 1 (al completar diagnóstico).
  # workflow_dispatch manual sigue disponible; default mode=shadow (no real).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview candidates without sending emails'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      mode:
        description: 'Send mode (shadow = buzón interno, real = competidor)'
        required: true
        default: 'shadow'
        type: choice
        options:
          - 'shadow'
          - 'real'
      limit:
        description: 'Maximum contacts to process'
        required: true
        default: '10'

jobs:
  outreach-shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger outreach batch
        env:
          CRON_SECRET: ${{ secrets.CLEEXS_CRON_SECRET }}
          API_URL: https://cleexsapi-production.up.railway.app
          DRY_RUN: ${{ inputs.dry_run }}
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CLEEXS_CRON_SECRET GitHub secret"
            exit 1
          fi

          payload=$(jq -n \
            --argjson limit "$LIMIT" \
            --argjson dryRun "$DRY_RUN" \
            --arg mode "$MODE" \
            '{limit:$limit, dryRun:$dryRun, mode:$mode}')

          curl --fail-with-body -sS \
            -X POST "$API_URL/api/cron/outreach-shadow" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload"
