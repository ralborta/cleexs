name: Free Diagnostic Follow-up

on:
  # Pausado 2026-09-03: solo onboarding paso 1 (al completar diagnóstico).
  # workflow_dispatch manual sigue disponible para pruebas.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview recipients without sending emails'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      registered_within_days:
        description: 'Ventana de registro (días)'
        required: true
        default: '20'
      limit:
        description: 'Maximum recipients'
        required: true
        default: '100'

jobs:
  send-free-diagnostic-followup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger free diagnostic follow-up emails
        env:
          CRON_SECRET: ${{ secrets.CLEEXS_CRON_SECRET }}
          API_URL: https://cleexsapi-production.up.railway.app
          DRY_RUN: ${{ inputs.dry_run }}
          REGISTERED_WITHIN_DAYS: ${{ inputs.registered_within_days }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CLEEXS_CRON_SECRET GitHub secret"
            exit 1
          fi

          payload=$(jq -n \
            --argjson registeredWithinDays "$REGISTERED_WITHIN_DAYS" \
            --argjson limit "$LIMIT" \
            --argjson dryRun "$DRY_RUN" \
            '{registeredWithinDays:$registeredWithinDays, limit:$limit, dryRun:$dryRun}')

          curl --fail-with-body -sS \
            -X POST "$API_URL/api/cron/free-diagnostic-followup" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload"
