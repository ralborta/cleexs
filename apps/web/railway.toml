# Config Railway solo para @cleexs/web (sin Prisma ni healthcheck de API).

[build]
builder = "RAILPACK"
buildCommand = "mkdir -p apps/web/.next/cache && NEXT_TELEMETRY_DISABLED=1 npm run build --workspace=@cleexs/web"

[deploy]
preDeployCommand = "/bin/true"
startCommand = "npm run start --workspace=@cleexs/web"
