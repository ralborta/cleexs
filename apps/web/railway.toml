# Config Railway solo para @cleexs/web (sin Prisma ni healthcheck de API).
# Usa el Dockerfile de la raíz del monorepo (mismo que EasyPanel preview).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# El CMD del Dockerfile ya arranca: node apps/web/server.js (standalone)
startCommand = "node apps/web/server.js"
