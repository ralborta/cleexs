# Config Railway solo para @cleexs/web (sin Prisma ni healthcheck de API).

[build]
builder = "RAILPACK"
buildCommand = "mkdir -p apps/web/.next/cache && NEXT_TELEMETRY_DISABLED=1 npm run build --workspace=@cleexs/web && mkdir -p apps/web/.next/standalone/apps/web/.next && cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static && cp -R apps/web/public apps/web/.next/standalone/apps/web/public"

[deploy]
preDeployCommand = "/bin/true"
# next bin no queda en PATH del runtime railpack; usar server standalone
startCommand = "node apps/web/.next/standalone/apps/web/server.js"
