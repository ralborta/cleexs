# Config Railway para @cleexs/api

[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = "/bin/true"
# prisma va en dependencies (no solo dev) para que exista en runtime de Railpack
startCommand = "./node_modules/.bin/prisma migrate deploy && node apps/api/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
