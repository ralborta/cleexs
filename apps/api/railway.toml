# Config Railway para @cleexs/api
# NO usar Dockerfile: el de la raíz es del web y rompe este servicio.

# Este servicio usa apps/api/Dockerfile (configurado en Railway).
# No forzar RAILPACK: el dockerfilePath del servicio gana y el startCommand
# debe coincidir con WORKDIR=/app del Dockerfile.

[deploy]
startCommand = "node apps/api/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
