# Config Railway para @cleexs/api
# NO usar Dockerfile: el de la raíz es del web y rompe este servicio.

[build]
builder = "RAILPACK"
buildCommand = "npm install && npm run build --workspace=@cleexs/shared && npm run build --workspace=@cleexs/api"

[deploy]
preDeployCommand = "/bin/true"
startCommand = "cd apps/api && node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
