# Config Railway para @cleexs/api

[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = "/bin/true"
# Migrates se corren aparte: el start anterior (prisma) tumba el deploy en Railpack.
# Prioridad: levantar API con CORS/CORP nuevos.
startCommand = "node apps/api/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
